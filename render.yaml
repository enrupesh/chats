services:
  - type: web
    name: veil-server
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install pnpm@10.26.1 --no-save && ./node_modules/.bin/pnpm install --frozen-lockfile && ./node_modules/.bin/pnpm --filter @veil/shared build && ./node_modules/.bin/pnpm --filter @veil/server build
    startCommand: node /opt/render/project/src/apps/server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: IDENTIFIER_HMAC_PEPPER
        sync: false
